[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "beom-workbench"
version = "0.1.0"
description = "Toolkit and desktop app for coding agents: analyze repositories, build or port features against approved acceptance criteria, and verify them (CLI, agent skill, MCP server)"
license = "LicenseRef-beom-workbench-use-only"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "multilspy>=0.1.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
app = ["PySide6-Essentials>=6.12", "PySide6-Addons>=6.12", "PySide6-WebEngine>=6.12"]

[project.scripts]
beom-workbench-mcp = "beom_workbench.main:main"
beom-workbench = "beom_workbench.cli:main"

[project.gui-scripts]
beom-workbench-app = "beom_workbench.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"beom_workbench.rulepacks" = ["*.yml"]
"beom_workbench.core" = ["*.ps1"]
"beom_workbench" = ["skills/*/*.md"]
"beom_workbench.app" = ["web/*", "web/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
