name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a request run in an empty folder
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "`beom-workbench --version` or the version label in the app"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options: [Claude Code, Codex, Antigravity, Not agent related]
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove anything private (paths, code, credentials) before posting.
