name: branch-policy

# feature 는 main 에서 만든다 → develop 에 합쳐 시험 → feature 를 main 에 합쳐 적용. develop 은 main 에 합치지 않는다.
on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  branch-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the branch flow
        shell: bash
        env:
          BASE: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python .github/branch_policy.py "$BASE" "$HEAD_REF" "$HEAD_SHA"
